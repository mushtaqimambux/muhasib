<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>KMI-30 Live</title>
<style>
  :root {
    --bg: #12151a;
    --card: #1a1f27;
    --card-border: #262c37;
    --text: #e7ebf1;
    --dim: #7c8697;
    --accent: #3ecf8e;
    --down: #e5484d;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); padding: 16px 16px 12px; border-bottom: 1px solid var(--card-border);
  }
  h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: 0.2px; }
  .sub { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
  main { padding: 12px 12px 40px; max-width: 640px; margin: 0 auto; }
  .stock {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    margin-bottom: 8px; overflow: hidden;
  }
  .stock-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; gap: 10px;
  }
  .sym-block { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; cursor: pointer; }
  .sym { font-weight: 700; font-size: 14.5px; letter-spacing: 0.3px; }
  .range { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .placeholder-text { font-size: 11.5px; color: var(--dim); }
  .price-block { text-align: right; cursor: pointer; }
  .now-price { font-family: var(--mono); font-weight: 700; font-size: 16px; }
  .change { font-family: var(--mono); font-size: 12px; }
  .change.up { color: var(--accent); }
  .change.down { color: var(--down); }
  .change.flat { color: var(--dim); }
  .load-btn {
    flex-shrink: 0; background: #232935; border: 1px solid var(--card-border); color: var(--text);
    border-radius: 9px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .load-btn:active { opacity: 0.7; }
  .load-btn.reload {
    width: 34px; height: 34px; padding: 0; display: flex; align-items: center; justify-content: center;
    color: var(--dim);
  }
  .load-btn.loading { color: var(--accent); }
  .stock-detail {
    display: none; padding: 0 14px 14px; font-family: var(--mono); font-size: 12px;
    color: var(--dim); line-height: 1.65; border-top: 1px solid var(--card-border);
  }
  .stock-detail.open { display: block; }
  .detail-section { margin-top: 10px; }
  .detail-label { color: var(--text); font-weight: 700; font-family: -apple-system, sans-serif; font-size: 11.5px; margin-bottom: 3px; }
  .err-text { color: var(--down); font-size: 11.5px; }
</style>
</head>
<body>

<header>
  <h1>KMI-30</h1>
  <div class="sub" id="subLine">Kisi bhi stock ke saamne "Load" dabayein — sab ek saath load nahi hote.</div>
</header>

<main>
  <div id="list"></div>
</main>

<script>
  const SYMBOLS = [
    "AIRLINK", "ATRL", "CPHL", "DGKC", "EFERT", "ENGROH", "FCCL", "FFC", "FFL",
    "GAL", "GHNI", "HCAR", "HUBC", "LUCK", "MARI", "MEBL", "MLCF", "NML", "NRL",
    "OGDC", "PAEL", "PPL", "PRL", "PSO", "SAZEW", "SEARL", "SNGP", "SSGC", "SYS", "TREET"
  ];

  const listEl = document.getElementById("list");

  function fmtTime(ts) {
    return new Date(ts * 1000).toLocaleTimeString("en-PK", {
      hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Asia/Karachi"
    });
  }
  function fmtEntry(entry) {
    return "Rs" + entry[1].toFixed(2) + " - " + fmtTime(entry[0]) + " - V-" + String(entry[2]).padStart(4, "0");
  }

  function isValidPayload(json) {
    return !!(json && json.data && Array.isArray(json.data) && json.data.length > 0);
  }

  async function fetchWithTimeout(url, ms) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try {
      return await fetch(url, { signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchViaProxy(target, attempt) {
    // MEBL and other high-volume stocks return a much larger payload, so the
    // free proxy needs more time — give it up to 20 seconds.
    const res = await fetchWithTimeout("https://api.allorigins.win/raw?url=" + encodeURIComponent(target), 20000);
    if (!res.ok) {
      if (attempt < 2) {
        await new Promise(r => setTimeout(r, 700));
        return fetchViaProxy(target, attempt + 1);
      }
      throw new Error("proxy failed after retry");
    }
    const json = await res.json();
    if (!isValidPayload(json)) {
      if (attempt < 2) {
        await new Promise(r => setTimeout(r, 700));
        return fetchViaProxy(target, attempt + 1);
      }
      throw new Error("proxy returned incomplete data after retry");
    }
    return json;
  }

  async function fetchSymbol(symbol) {
    const target = "https://dps.psx.com.pk/timeseries/int/" + symbol;
    try {
      const res = await fetchWithTimeout(target, 8000);
      if (res.ok) {
        const json = await res.json();
        if (isValidPayload(json)) return json;
      }
    } catch (e) {
      // fall through to proxy below, regardless of why the direct attempt failed
    }
    return await fetchViaProxy(target, 1);
  }

  function processStock(symbol, data) {
    if (!data || !data.data || data.data.length === 0) return null;
    const ticks = data.data;
    const allPrices = ticks.map(t => t[1]);
    const low = Math.min(...allPrices);
    const high = Math.max(...allPrices);
    const current = ticks[0];
    const openEntry = ticks[ticks.length - 1];
    const closeEntry = ticks[0];
    const change = current[1] - openEntry[1];
    const pctChange = openEntry[1] !== 0 ? (change / openEntry[1]) * 100 : 0;

    let minEntry = ticks[0], maxEntry = ticks[0];
    for (let i = 1; i < ticks.length; i++) {
      if (ticks[i][1] < minEntry[1]) minEntry = ticks[i];
      if (ticks[i][1] > maxEntry[1]) maxEntry = ticks[i];
    }
    const nonZeroVol = ticks.filter(t => t[2] > 0);
    let minVolEntry = nonZeroVol.length ? nonZeroVol[0] : ticks[0];
    let maxVolEntry = ticks[0];
    for (const t of nonZeroVol) if (t[2] < minVolEntry[2]) minVolEntry = t;
    for (const t of ticks) if (t[2] > maxVolEntry[2]) maxVolEntry = t;

    let filtered = [];
    for (let i = 0; i < ticks.length; i++) {
      const nextPrice = ticks[i + 1] ? ticks[i + 1][1] : null;
      if (nextPrice === null || ticks[i][1] !== nextPrice) filtered.push(ticks[i]);
    }
    const recentTicks = filtered.slice(0, 6);

    return { symbol, low, high, current, openEntry, closeEntry, change, pctChange, minEntry, maxEntry, minVolEntry, maxVolEntry, recentTicks };
  }

  // ---------- Render the static list immediately, no data yet ----------
  function emptyCardHtml(symbol) {
    return `
      <div class="stock" data-symbol="${symbol}">
        <div class="stock-head">
          <div class="sym-block">
            <div class="sym">${symbol}</div>
            <div class="placeholder-text">Not loaded yet</div>
          </div>
          <button class="load-btn" data-load="${symbol}">Load</button>
        </div>
        <div class="stock-detail" id="detail-${symbol}"></div>
      </div>`;
  }

  function loadedCardInner(s) {
    const dir = s.change > 0.001 ? "up" : s.change < -0.001 ? "down" : "flat";
    const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "•";
    return `
      <div class="stock-head">
        <div class="sym-block" data-toggle="${s.symbol}">
          <div class="sym">${s.symbol}</div>
          <div class="range">${s.low.toFixed(2)} - ${s.high.toFixed(2)}</div>
        </div>
        <div class="price-block" data-toggle="${s.symbol}">
          <div class="now-price">Rs${s.current[1].toFixed(2)}</div>
          <div class="change ${dir}">${arrow} ${Math.abs(s.change).toFixed(2)} (${s.pctChange.toFixed(2)}%)</div>
        </div>
        <button class="load-btn reload" data-load="${s.symbol}" aria-label="Reload ${s.symbol}" title="Reload">↻</button>
      </div>
      <div class="stock-detail" id="detail-${s.symbol}">
        <div class="detail-section">
          <div class="detail-label">Recent ticks</div>
          ${s.recentTicks.map(t => fmtEntry(t)).join("<br>")}
        </div>
        <div class="detail-section">
          <div class="detail-label">Price</div>
          Now: ${fmtEntry(s.current)}<br>
          Min: ${fmtEntry(s.minEntry)}<br>
          Max: ${fmtEntry(s.maxEntry)}
        </div>
        <div class="detail-section">
          O: ${fmtEntry(s.openEntry)}<br>
          C: ${fmtEntry(s.closeEntry)}
        </div>
        <div class="detail-section">
          <div class="detail-label">Volume</div>
          Min-V ${String(s.minVolEntry[2]).padStart(4, "0")} - Rs${s.minVolEntry[1].toFixed(2)} - ${fmtTime(s.minVolEntry[0])}<br>
          Max-V ${String(s.maxVolEntry[2]).padStart(4, "0")} - Rs${s.maxVolEntry[1].toFixed(2)} - ${fmtTime(s.maxVolEntry[0])}
        </div>
      </div>`;
  }

  function errorCardInner(symbol) {
    return `
      <div class="stock-head">
        <div class="sym-block">
          <div class="sym">${symbol}</div>
          <div class="err-text">Load nahi hua — dobara try karein</div>
        </div>
        <button class="load-btn" data-load="${symbol}">Retry</button>
      </div>`;
  }

  async function loadOne(symbol) {
    const card = document.querySelector(`.stock[data-symbol="${symbol}"]`);
    const btn = card.querySelector("[data-load]");
    btn.classList.add("loading");
    btn.textContent = btn.classList.contains("reload") ? "…" : "Loading…";
    btn.disabled = true;

    try {
      const data = await fetchSymbol(symbol);
      const s = processStock(symbol, data);
      if (!s) throw new Error("no data");
      card.innerHTML = loadedCardInner(s);
      attachCardListeners(card);
    } catch (e) {
      card.innerHTML = errorCardInner(symbol);
      attachCardListeners(card);
    }
  }

  function attachCardListeners(card) {
    const loadBtn = card.querySelector("[data-load]");
    if (loadBtn) loadBtn.addEventListener("click", () => loadOne(loadBtn.getAttribute("data-load")));
    card.querySelectorAll("[data-toggle]").forEach(el => {
      el.addEventListener("click", () => {
        const sym = el.getAttribute("data-toggle");
        document.getElementById("detail-" + sym).classList.toggle("open");
      });
    });
  }

  function init() {
    listEl.innerHTML = SYMBOLS.map(emptyCardHtml).join("");
    document.querySelectorAll(".stock").forEach(attachCardListeners);
  }

  init();
</script>
</body>
</html>
